<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#f8fafc;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:72px;position:relative;overflow:hidden}
  .glow{position:absolute;right:-200px;top:-200px;width:680px;height:680px;border-radius:50%;
        background:radial-gradient(circle,rgba(37,99,235,.18),rgba(37,99,235,0) 70%)}
  .brand{display:flex;align-items:center;gap:15px;margin-bottom:40px}
  .mark{width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#1d4ed8);
        display:flex;align-items:center;justify-content:center}
  .name{font-size:31px;font-weight:700;color:#0f172a;letter-spacing:-.02em}
  h1{font-size:60px;line-height:1.08;font-weight:800;color:#0f172a;letter-spacing:-.03em;max-width:1010px}
  h1 span{color:#2563eb}
  p{margin-top:24px;font-size:26px;color:#475569;font-weight:400;max-width:880px;line-height:1.4}
  .chips{display:flex;gap:12px;margin-top:40px}
  .chip{font-size:20px;font-weight:600;color:#1e40af;background:#dbeafe;padding:11px 20px;border-radius:999px}
</style></head><body>
  <div class="glow"></div>
  <div class="brand">
    <div class="mark">
      <svg width="33" height="33" viewBox="0 0 32 32" fill="none">
        <rect x="6" y="8" width="20" height="16" rx="3" stroke="white" stroke-width="2.4"/>
        <path d="M6.5 11 16 18l9.5-7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="name">Mailsorter</div>
  </div>
  <h1>Votre boîte mail, <span>triée pendant que vous dormez.</span></h1>
  <p>L'IA lit, comprend et range vos emails Gmail. Chaque action reste validée par vous, et annulable d'un clic.</p>
  <div class="chips"><div class="chip">Tri par IA</div><div class="chip">Désabonnement 1-clic</div><div class="chip">Tout est réversible</div></div>
</body></html>
