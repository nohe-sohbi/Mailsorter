# Local overlay: publishes the ports that docker-compose.yml deliberately does
# not.
#
# The main file has no `ports` because Dokploy routes to the containers through
# its own proxy, and a published host port there is at best useless and at worst
# a collision. But that left `make up` telling every newcomer to open
# localhost:3000 on a stack that bound nothing, which is the first thing anyone
# running this locally hits.
#
# Kept as a SEPARATE file rather than docker-compose.override.yml on purpose:
# Compose merges an override automatically, so the deployment would pick it up
# too. It is opted into explicitly by `make up`.
services:
  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # A model you run yourself (Ollama, llama.cpp, LM Studio, vLLM). The main
    # file never forwarded these, so an OLLAMA_MODEL set in .env silently never
    # reached the container. They live here, not in docker-compose.yml, so the
    # deployment keeps exactly the variables it had. See "IA locale" in the
    # README.
    environment:
      # The container always listens on 8080: the healthcheck, the frontend
      # proxy and the port mapping above all expect it. BACKEND_PORT only
      # moves the HOST side, so a busy 8080 on your machine is one .env line.
      PORT: "8080"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
    # Names the host machine host.docker.internal inside the container, on
    # Linux too (Docker Desktop already does it), so a model server running on
    # the same machine is reachable without knowing the bridge address.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  # Published so you can inspect the database with a GUI while developing. It is
  # bound to the loopback interface, not 0.0.0.0: the credentials default to
  # admin/password, so this must never be reachable from the network.
  mongodb:
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
