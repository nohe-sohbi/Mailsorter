server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Who the visitor is, for the backend's rate limiting. In production the
    # request reaches nginx through the platform's own reverse proxy (Traefik on
    # Dokploy), so $remote_addr is that proxy and every visitor would look the
    # same. realip rewrites it from X-Forwarded-For, trusting only the private
    # hops in front of us, and real_ip_recursive walks the list from the right
    # past those hops: the address it stops at is the first one none of our
    # proxies vouched for, so a visitor who writes their own X-Forwarded-For
    # cannot choose it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The bundle is text and compresses to about a quarter of its size. Without
    # this every visitor downloaded the 540 KB main script as is.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # The security headers of the page itself. The API sets its own on every
    # /api answer, but the page is where an email's HTML is rendered, and it had
    # none: any site could frame it. Not a full Content-Security-Policy yet,
    # only the directives that cannot break a script, a font or an email image:
    # no framing, no plugins, no <base> hijack, and a form inside an email cannot
    # post anywhere. They are repeated in each location below because nginx
    # drops every inherited add_header in a location that sets one of its own.

    # Hashed build assets: the filename changes whenever the content does, so
    # they can be cached forever. Served with try_files ... =404 rather than
    # falling back to index.html: a missing bundle must fail as a missing
    # bundle, not arrive as HTML with a 200 and a text/html content type.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # index.html is the only unhashed file, and it is what points at the current
    # bundle. Without this it is served with nothing but an ETag, so browsers
    # apply their freshness heuristic and can keep a deployment-old copy for
    # hours: the visitor then loads yesterday's app and sees yesterday's copy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # The backend's health, at the address the deploy checklist curls. nginx
    # only forwarded /api, so /health fell through to index.html and answered
    # 200 with the app's page whether the backend was up or not. /metrics stays
    # internal on purpose: it is not routed here.
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # The visitor's address as resolved above. Set, not appended: whatever
        # the visitor sent under this name is overwritten, which is why the
        # backend may believe it (clientIP in backend/internal/api/middleware.go).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # The synchronous AI analysis may take up to 120 s (ai_handlers.go) and
        # the backend allows itself 150 s to answer (WriteTimeout in main.go).
        # nginx's default of 60 s cut it off first, with a 504.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    error_page 404 /index.html;
}
