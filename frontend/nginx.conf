server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: the filename changes whenever the content does, so
    # they can be cached forever. Served with try_files ... =404 rather than
    # falling back to index.html: a missing bundle must fail as a missing
    # bundle, not arrive as HTML with a 200 and a text/html content type.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the only unhashed file, and it is what points at the current
    # bundle. Without this it is served with nothing but an ETag, so browsers
    # apply their freshness heuristic and can keep a deployment-old copy for
    # hours: the visitor then loads yesterday's app and sees yesterday's copy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 404 /index.html;
}
